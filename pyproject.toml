[project]
name = "epl-predictor"
version = "0.1.0"
description = "Premier League match-outcome predictor (home / draw / away) built on 33 seasons of match data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "xgboost>=2.0", "lightgbm>=4.0",
    "optuna>=3.0", "scipy>=1.10", "matplotlib>=3.7", "pyarrow>=12.0", "joblib>=1.3",
]

[project.scripts]
epl-train = "epl_predictor.train:main"
epl-predict = "epl_predictor.predict:main"
epl-evaluate = "epl_predictor.evaluate:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
